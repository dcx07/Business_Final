<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow - 专注任务板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>FocusFlow</h1>
        <p>轻量任务管理 + 番茄钟，所有数据保存在本地。</p>
      </header>

      <section class="panel">
        <h2>➕ 新任务</h2>
        <form id="task-form">
          <input id="task-input" type="text" placeholder="输入任务，例如：完成项目原型" required maxlength="80" />
          <button type="submit">添加</button>
        </form>
      </section>

      <section class="panel">
        <h2>📋 任务列表</h2>
        <ul id="task-list"></ul>
      </section>

      <section class="panel timer-panel">
        <h2>⏱️ 番茄钟</h2>
        <div id="time-display">25:00</div>
        <div class="timer-actions">
          <button id="start-btn">开始</button>
          <button id="pause-btn">暂停</button>
          <button id="reset-btn">重置</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
